name: Android QA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "package.json"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/android-qa-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME" || true
          test -d "$ANDROID_HOME/platforms"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Match Expo SDK versions
        run: npx expo install --fix
        env:
          CI: '1'
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          CI: '1'
      - name: Prepare temporary QA signing
        run: python3 scripts/ensure_qa_signing.py
      - name: Bundle JavaScript and build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Confirm APK exists
        run: test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
      - name: Upload Realme C71 APK
        uses: actions/upload-artifact@v4
        with:
          name: JOY-VIMO-Realme-C71-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
