name: Android QA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "package.json"
      - "assets/**"
      - "modules/**"
      - "scripts/**"
      - ".github/workflows/android-qa-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Match Expo SDK dependencies
        run: npx expo install --fix
        env:
          CI: '1'
      - name: Verify app policy unit assertions
        run: node tests/policy.test.cjs
      - name: Generate approved branding assets
        run: npm run assets
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          CI: '1'
      - name: Prepare test-only signing
        run: python3 scripts/ensure_qa_signing.py
      - name: Build bundled QA APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Confirm APK generated
        run: test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: JOY-VIMO-Integrated-Private-QA-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
