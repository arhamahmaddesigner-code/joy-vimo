name: Android QA APK

# Deliberately manual-only. Partial source changes must NOT generate
# a new owner-facing APK or trigger unnecessary install requests.
on:
  workflow_dispatch:
    inputs:
      publish_private_apk:
        description: 'Upload owner-facing APK only with stable signing secrets'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compile installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Match Expo SDK dependencies
        run: npx expo install --fix
        env:
          CI: '1'
      - name: Verify app policy unit assertions
        run: |
          node tests/policy.test.cjs
          node tests/domainRules.test.cjs
          node tests/scheduleRules.test.cjs
          node tests/progress.test.cjs
          node tests/goals.test.cjs
          node tests/focusStatus.test.cjs
          node tests/focusSync.test.cjs
          node tests/localErase.test.cjs
          node tests/localPersistence.test.cjs
          node tests/reminderScheduler.test.cjs
          node tests/mobileLayout.test.cjs
          node tests/qaVersion.test.cjs
          node tests/leaderboardAuth.test.cjs
          node tests/cloudActionGate.test.cjs
          node tests/leaderboardMigration.test.cjs
          node tests/feedFeedback.test.cjs
          node tests/feedPreferenceLoad.test.cjs
          node tests/memoryGarden.test.cjs
          node tests/reviewedVideoCatalog.test.cjs
          node tests/approvedVideoPlayer.test.cjs
          node tests/localWriteQueue.test.cjs
      - name: Run privacy & release preflight
        run: python3 scripts/privacy_preflight.py
      - name: Fast JavaScript and JSX syntax preflight
        run: |
          node -e "const fs=require('fs');const babel=require('@babel/parser');for(const f of ['App.js',...fs.readdirSync('components').filter(x=>x.endsWith('.js')).map(x=>'components/'+x)])babel.parse(fs.readFileSync(f,'utf8'),{sourceType:'module',plugins:['jsx']});console.log('PASS: JSX syntax');"
      - name: Enforce full-scope owner APK release gates
        env:
          JOY_PUBLISH_PRIVATE_APK: ${{ inputs.publish_private_apk }}
        run: node scripts/privateApkReleaseGate.cjs
      - name: Generate approved branding assets
        run: npm run assets
      - name: Assign unique private QA versionCode
        run: node scripts/qaVersion.cjs
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          CI: '1'
      - name: Configure signing (internal compile or stable private APK)
        run: python3 scripts/ensure_qa_signing.py
        env:
          JOY_PUBLISH_PRIVATE_APK: ${{ inputs.publish_private_apk }}
          JOY_QA_KEYSTORE_BASE64: ${{ secrets.JOY_QA_KEYSTORE_BASE64 }}
          JOY_QA_STORE_PASSWORD: ${{ secrets.JOY_QA_STORE_PASSWORD }}
          JOY_QA_KEY_ALIAS: ${{ secrets.JOY_QA_KEY_ALIAS }}
          JOY_QA_KEY_PASSWORD: ${{ secrets.JOY_QA_KEY_PASSWORD }}
      - name: Build bundled QA APK
        env:
          JOY_QA_STORE_PASSWORD: ${{ secrets.JOY_QA_STORE_PASSWORD }}
          JOY_QA_KEY_ALIAS: ${{ secrets.JOY_QA_KEY_ALIAS }}
          JOY_QA_KEY_PASSWORD: ${{ secrets.JOY_QA_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Confirm APK generated
        run: test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
      - name: Verify private APK signature and record fingerprint
        if: ${{ inputs.publish_private_apk }}
        shell: bash
        env:
          JOY_QA_STORE_PASSWORD: ${{ secrets.JOY_QA_STORE_PASSWORD }}
          JOY_QA_KEY_ALIAS: ${{ secrets.JOY_QA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${JOY_QA_KEYSTORE_PATH:-}"
          test -f "$JOY_QA_KEYSTORE_PATH"
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          test -n "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apksigner=$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          test -x "$apksigner"
          aapt=$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$aapt"
          "$aapt" dump badging "$apk" | grep '^package:' | tee private-apk-identity.txt
          expected_version=$(node -p "require('./app.json').expo.android.versionCode")
          expected_name=$(node -p "require('./app.json').expo.version")
          grep -F "name='com.joyvimo.app'" private-apk-identity.txt
          grep -F "versionCode='$expected_version'" private-apk-identity.txt
          grep -F "versionName='$expected_name'" private-apk-identity.txt
          "$apksigner" verify --verbose --print-certs "$apk" | tee private-apk-signature.txt
          expected=$(keytool -list -v -keystore "$JOY_QA_KEYSTORE_PATH" -alias "$JOY_QA_KEY_ALIAS" -storepass:env JOY_QA_STORE_PASSWORD | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          test -n "$actual"
          test "$expected" = "$actual"
          sha256sum "$apk" | tee private-apk-sha256.txt
          echo "Verified APK signing details and SHA256 are in this run's logs."
      - name: Upload QA APK
        if: ${{ inputs.publish_private_apk }}
        uses: actions/upload-artifact@v6
        with:
          name: JOY-VIMO-Integrated-Private-QA-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
