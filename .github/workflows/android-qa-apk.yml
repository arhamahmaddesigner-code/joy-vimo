name: Android QA APK

# Deliberately manual-only. Partial source changes must NOT generate
# a new owner-facing APK or trigger unnecessary install requests.
on:
  workflow_dispatch:
    inputs:
      publish_private_apk:
        description: 'Upload owner-facing APK only with stable signing secrets'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compile installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Match Expo SDK dependencies
        run: npx expo install --fix
        env:
          CI: '1'
      - name: Verify app policy unit assertions
        run: |
          node tests/policy.test.cjs
          node tests/domainRules.test.cjs
          node tests/scheduleRules.test.cjs
          node tests/progress.test.cjs
      - name: Run privacy & release preflight
        run: python3 scripts/privacy_preflight.py
      - name: Generate approved branding assets
        run: npm run assets
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          CI: '1'
      - name: Configure signing (internal compile or stable private APK)
        run: python3 scripts/ensure_qa_signing.py
        env:
          JOY_PUBLISH_PRIVATE_APK: ${{ inputs.publish_private_apk }}
          JOY_QA_KEYSTORE_BASE64: ${{ secrets.JOY_QA_KEYSTORE_BASE64 }}
          JOY_QA_STORE_PASSWORD: ${{ secrets.JOY_QA_STORE_PASSWORD }}
          JOY_QA_KEY_ALIAS: ${{ secrets.JOY_QA_KEY_ALIAS }}
          JOY_QA_KEY_PASSWORD: ${{ secrets.JOY_QA_KEY_PASSWORD }}
      - name: Build bundled QA APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Confirm APK generated
        run: test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
      - name: Verify stable private signing certificate
        if: ${{ inputs.publish_private_apk }}
        run: |
          test -n "$JOY_QA_KEYSTORE_PATH"
          test -f "$JOY_QA_KEYSTORE_PATH"
          echo 'Private signing certificate was loaded from protected secrets.'
      - name: Upload QA APK
        if: ${{ inputs.publish_private_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: JOY-VIMO-Integrated-Private-QA-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
