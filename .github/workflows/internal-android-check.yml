name: Internal Android Integration Check

# Only runs for a deliberate internal QA trigger or explicit manual request.
# No owner APK artifacts or distribution. Installs only on a disposable CI emulator.
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/run-internal-android-compile.txt'

permissions:
  contents: read

concurrency:
  group: joy-vimo-private-ci
  cancel-in-progress: false

jobs:
  android-integration:
    name: Compile and verify Android privately
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Reserve disk for native build and emulator
        shell: bash
        run: |
          # These unrelated SDKs are disposable only on GitHub-hosted runners.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          python3 -c 'import shutil; free=shutil.disk_usage(".").free/2**30; print(f"Free before build: {free:.1f} GiB"); assert free >= 24, "Need 24 GiB for native build plus emulator; stop before compilation"'
      - name: Provision emulator image before compiling
        # Fail early on image download/disk issues rather than after a 20-minute build.
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64"'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Match Expo dependencies
        run: npx expo install --check
        env:
          CI: '1'
      - name: Unit and privacy checks
        run: npm test
      - name: Fast JavaScript and JSX syntax preflight
        run: npm run check:syntax
      - name: Generate assets
        run: npm run assets
      - name: Generate native Android source
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          CI: '1'
      - name: Internal ephemeral compile signing
        run: python3 scripts/ensure_qa_signing.py
        env:
          JOY_PUBLISH_PRIVATE_APK: 'false'
      - name: Report private signing readiness (no secret values)
        env:
          JOY_QA_KEYSTORE_BASE64: ${{ secrets.JOY_QA_KEYSTORE_BASE64 }}
          JOY_QA_STORE_PASSWORD: ${{ secrets.JOY_QA_STORE_PASSWORD }}
          JOY_QA_KEY_ALIAS: ${{ secrets.JOY_QA_KEY_ALIAS }}
          JOY_QA_KEY_PASSWORD: ${{ secrets.JOY_QA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$JOY_QA_KEYSTORE_BASE64" && -n "$JOY_QA_STORE_PASSWORD" && -n "$JOY_QA_KEY_ALIAS" && -n "$JOY_QA_KEY_PASSWORD" ]]; then
            echo "Private QA signing: all four required secret inputs are present (keystore validation still pending)."
          else
            echo "Private QA signing: not ready; at least one required protected input is missing. Internal Android compilation continues without artifact upload."
          fi
      - name: Cache internal Gradle dependencies
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          dependency-graph: disabled
      - name: Compile integrated Android
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify local output exists
        run: |
          test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          echo "PASS: internal APK compiled but intentionally NOT uploaded"

      - name: Enable emulator acceleration
        run: |
          df -h /
          python3 -c 'import shutil; free=shutil.disk_usage(".").free/2**30; print(f"Free before AVD: {free:.1f} GiB"); assert free >= 4, "Need 4 GiB for disposable emulator data"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Internal offline Android UI smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/androidSmoke.py
      - name: Retain internal UI evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: internal-android-ui-evidence
          path: qa-evidence/
          if-no-files-found: ignore
          retention-days: 14
