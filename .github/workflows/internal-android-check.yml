name: Internal Android Integration Check

# Only runs for a deliberate internal QA trigger or explicit manual request.
# No APK artifacts, releases, installs, or distribution.
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/run-internal-android-compile.txt'

permissions:
  contents: read

concurrency:
  group: joy-vimo-private-ci
  cancel-in-progress: false

jobs:
  android-integration:
    name: Compile and verify Android privately
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Match Expo dependencies
        run: npx expo install --fix
        env:
          CI: '1'
      - name: Unit and privacy checks
        run: |
          node tests/policy.test.cjs
          node tests/domainRules.test.cjs
          node tests/scheduleRules.test.cjs
          node tests/progress.test.cjs
          node tests/goals.test.cjs
          node tests/focusStatus.test.cjs
          node tests/focusSync.test.cjs
          node tests/localErase.test.cjs
          node tests/localPersistence.test.cjs
          node tests/localWriteQueue.test.cjs
          node tests/reminderScheduler.test.cjs
          node tests/mobileLayout.test.cjs
          node tests/qaVersion.test.cjs
          node tests/leaderboardAuth.test.cjs
          node tests/leaderboardMigration.test.cjs
          node tests/feedFeedback.test.cjs
          node tests/memoryGarden.test.cjs
          python3 scripts/privacy_preflight.py
      - name: Fast JavaScript and JSX syntax preflight
        run: |
          node -e "const fs=require('fs');const babel=require('@babel/parser');for(const f of ['App.js',...fs.readdirSync('components').filter(x=>x.endsWith('.js')).map(x=>'components/'+x)])babel.parse(fs.readFileSync(f,'utf8'),{sourceType:'module',plugins:['jsx']});console.log('PASS: JSX syntax');"
      - name: Generate assets
        run: npm run assets
      - name: Generate native Android source
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          CI: '1'
      - name: Internal ephemeral compile signing
        run: python3 scripts/ensure_qa_signing.py
        env:
          JOY_PUBLISH_PRIVATE_APK: 'false'
      - name: Report private signing readiness (no secret values)
        env:
          JOY_QA_KEYSTORE_BASE64: ${{ secrets.JOY_QA_KEYSTORE_BASE64 }}
          JOY_QA_STORE_PASSWORD: ${{ secrets.JOY_QA_STORE_PASSWORD }}
          JOY_QA_KEY_ALIAS: ${{ secrets.JOY_QA_KEY_ALIAS }}
          JOY_QA_KEY_PASSWORD: ${{ secrets.JOY_QA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$JOY_QA_KEYSTORE_BASE64" && -n "$JOY_QA_STORE_PASSWORD" && -n "$JOY_QA_KEY_ALIAS" && -n "$JOY_QA_KEY_PASSWORD" ]]; then
            echo "Private QA signing: all four required secret inputs are present (keystore validation still pending)."
          else
            echo "Private QA signing: not ready; at least one required protected input is missing. Internal Android compilation continues without artifact upload."
          fi
      - name: Compile integrated Android
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify local output exists
        run: |
          test -n "$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          echo "PASS: internal APK compiled but intentionally NOT uploaded"
